# Pixel farm + LLM — Worker 名须与 Cloudflare CI 项目一致
name = "aigame"
main = "server/src/index.js"
compatibility_date = "2026-03-23"
workers_dev = true

# 勿在此声明 [[routes]]，否则 CI 部署会与仍占用 statutebill.com 的旧 Worker「99」冲突（API code 10020）。
# 做法二选一：
# 1) 控制台删除 Worker 99 上相同 pattern 的路由后，再把 [[routes]] 加回本文件；或
# 2) 在控制台为 Worker「aigame」手动绑定自定义域 / 路由（不通过 wrangler 写路由）。

[assets]
directory = "client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 密钥：wrangler secret put OPENROUTER_API_KEY
# 本地：server/.dev.vars 写 OPENROUTER_API_KEY=sk-or-...
